# ============================================================
# zk-ge-verification 产物：verification-plan.yaml（人工填写，非模板占位）
# 对应 A4 文件布局中 .zkge/architecture/verification-plan.yaml
# 每 claim 的验证方法 + 工具链（阶段 ⑤ 测试设计的落点）
#
# 填写依据：.zkge/roles.md 第 0 步尺子校准结果 + package.json 实际脚本 + 仓库实际测试文件。
# 铁律：verifiers 里标【缺】的，其结论不得用于门禁；标 under_blind_spot 的，盲区内结论不得用于门禁。
# ============================================================
schema: zkge.verification-plan/v1
project_id: PROJECT.RTC

# ── 验证器清单（第 0 步校准对象）────────────────────────────────────────────
verifiers:
  - id: static_check
    version: "scripts/check-static.mjs @ 385d397"
    owner: douba
    self_test_result: 通过（在已知坏例上能报错）
    known_blind_spots:
      - 只证明代码可被加载与解析，不证明行为正确
      - 抓不到运行时 ReferenceError 之外的逻辑错误

  - id: check_js_undefined
    version: "scripts/check-undefined.mjs @ 385d397"
    owner: douba
    self_test_result: 通过（历史事故「删掉顶层常量 → 整页 hidden」可被检出）
    known_blind_spots:
      - 只 grep TS2304/TS2552，别名与动态引用抓不到

  - id: node_unit_tests
    version: "tests/*.test.mjs + meeting-board/tests/*.test.mjs @ 385d397"
    owner: douba
    self_test_result: 通过（npm test）
    known_blind_spots:
      - 这些测试是模块级/纯函数级，不覆盖真实音频链路与真实文件写入
      - 根 npm test 不含 meeting-board 的 8 个测试，须在 meeting-board/ 下另跑一次 npm test

  - id: check_audio
    version: "tests/audio-pipeline.browser.mjs"
    owner: douba
    self_test_result: "未校准（本机实测 2026-09-23 跑不通）——Playwright 本体在（全局 1.58.1），但缺 headless 浏览器二进制：~/Library/Caches/ms-playwright/chromium_headless_shell-1200 不存在（缓存里只有完整版 chromium-1200）。实测报错 browserType.launch: Executable doesn't exist，退出码 1。修法一行：npx playwright install chromium-headless-shell。装好前本验证器不得用于门禁。"
    known_blind_spots:
      - 浏览器音频路径与 WKWebView 不同，无法复现 AudioContext.state = 'interrupted'
      - "脚本自述「装不上时退出码 2（=没跑成，不是通过）」，但浏览器缺失这条路径实际是未捕获异常、退出码 1——缺件与跑失败在退出码上分不开"

  - id: check_ux
    version: "scripts/check-ux.mjs"
    owner: douba
    self_test_result: "未校准（本机实测 2026-09-23 跑不通）——与 check_audio 同一个卡点：缺 chromium_headless_shell-1200。该脚本正确地以退出码 2 表示「没跑成」，未被误判为通过。修法一行：npx playwright install chromium-headless-shell。装好前本验证器不得用于门禁。"
    known_blind_spots:
      - 只做结构/存在性检查，UX 语义内容（UX-2/5/6/7/8）机器判定不了
      - 拿旧构建会得出假结论（验的是 dist/meeting-board，必须先 vite build）

  - id: runtime_manual
    version: "桌面端人工实测（npm run dev）"
    owner: douba
    self_test_result: 不适用（人工）
    known_blind_spots:
      - 无法穷举，只能验证代表性场景
      - 结论不可重放

  - id: code_review_graph
    version: "code-review-graph 2.3.7 @ ~/.local/bin（图建于 3623308 / feature/push-to-talk）"
    owner: douba
    self_test_result: "部分校准——正向探针通过（callers_of 最高入度符号得 258 个调用方）、负向探针通过（不存在的符号返回 0，能区分「没查到」与「真的没有」）；但 tests_for 对 JavaScript 失明：20 个 JS 测试文件只有 1 个产出 TESTED_BY 边（1/20），故 tests_for 不得用于门禁。替代口径 = IMPORTS_FROM 反查测试文件导入的实现文件，已随 graphs/implementation.snapshot.json 导出（14 个测试文件 → 实现文件）。"
    known_blind_spots:
      - 对反射/动态代码存在静态抽取盲区
      - "tests_for / TESTED_BY 对 JavaScript 基本失明（1/20）——查询返回 0 不得当成「真的没测试」，改用 IMPORTS_FROM 反查"
      - "Rust 的 in-file 测试（#[cfg(test)]）不构成独立测试文件，TESTED_BY 的 file_path 落在实现文件上，按文件口径统计会低估"
      - "图是快照：工作区推进后 built_at_commit 会落后于 current_sha，须重建后再用于门禁"

  - id: property_test
    version: "【缺】未自建"
    owner: —
    self_test_result: 不适用
    known_blind_spots:
      - 技能未提供，项目未自建；依赖它的 claim 在补齐前不得判定 PASS

