    impact_if_fails: "CLAIM.REC.004；能力问题 C-034"
  - id: L3-01
    scenario: "录音中拔麦 / 系统静音输入：界面必须报出无有效声音"
    stage: "采集·真实设备"
    system: "Tauri 桌面端 + 真实麦克风"
    component: "src/js/audio.js startAudioFlowWatch"
    code_loc: "（人工实测脚本待补）"
    deps: "真实设备 + 系统设置"
    risk: "高：录的是空气，用户以为在录"
    impact_if_fails: "CLAIM.AUDIO.001；能力问题 C-001"
  - id: L3-02
    scenario: "落盘失败（磁盘满 / 目录不可写）时不得显示成功"
    stage: "记录·持久化"
    system: "Tauri 桌面端 + 真实文件系统"
    component: "src/js/storage.js / history.js"
    code_loc: "（人工实测脚本待补）"
    deps: "需构造故障（挂载只读卷 / 占满磁盘）"
    risk: "高：内容丢失且无告知"
    impact_if_fails: "CLAIM.REC.001 / REC.002；能力问题 C-003 / S-064"
  - id: L3-03
    scenario: "清除历史后所有界面同步（主列表 / 统计 / 白板），且无残留副本"
    stage: "数据生命周期"
    system: "Tauri 桌面端"
    component: "src/js/history.js / state.js"
    code_loc: "（人工实测脚本待补）"
    deps: "真实数据目录（须用 RTC_DATA_DIR 隔离，勿动真实记录）"
    risk: "高：不可逆清除不彻底"
    impact_if_fails: "CLAIM.REC.003 / REC.004 / REC.005；能力问题 S-072 / S-184 / C-025 / C-034"
  - id: L3-04
    scenario: "同机多实例并发写同一份记录与配置"
    stage: "并发"
    system: "Tauri 桌面端 + 浏览器版"
    component: "src/js/storage.js"
    code_loc: "（人工实测脚本待补）"
    deps: "需同时启动 dev 与已安装应用"
    risk: "高：静默互相覆盖"
    impact_if_fails: "CLAIM.CONFIG.005；能力问题 C-037"

# ── 覆盖率策略 ───────────────────────────────────────────────────────────────
coverage:
  hard_gates:
    - "L0/L1 全绿（npm test 通过）——否则不得进入任何里程碑"
  targets:
    - "L2 白板测试全绿（先 vite build）"
    - "L3 每个 R3 冻结 claim 至少一条真实环境实测记录"
  honest_declaration: |
    当前状态：L0/L1 已有 6 个测试文件（挂在 npm test）；L2 有 8 个白板测试文件但未挂进 CI；
    L3 为 0 —— 4 条 L3 用例（L3-01..04）连脚本都还没有。
    与目标的差距：
    ① 38 条 R3 claim 中，只有约 12 条能映射到现有测试，其余依赖人工实测或属性测试框架（未自建）；
    ② 真实故障形态（磁盘满 / 设备拔插 / 系统静音 / 睡眠唤醒 / 更新中断）没有任何自动化等价覆盖；
    ③ 浏览器检查（check:audio / check:ux）无法复现 WKWebView 的 AudioContext 'interrupted'，需 Playwright 且当前依赖不在仓库中；
    ④ 覆盖率数字 ≠ 故障注入等价性——本表不提供行覆盖率，也不以覆盖率作为通过依据。

