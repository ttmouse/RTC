# score-card.yaml —— 测试设计 Score Card（阶段⑤ 测试设计）
# 项目：RTC 实时语音转文字 ｜ 人工填写（替换技能模板）
#
# 核心思想（诚实原则）：
#   Score Card 先行，覆盖率只是反向校验 —— 每个测试从场景倒推而来，覆盖率是结果不是目标。
#   「倒推影响面」列是本表灵魂：每个测试失败时，它倒推证明哪个设计点被破坏。
#   质量密度 = 需求声明 + 状态与交互 + 错误路径 + 变异与故障 + 真实运行 五维同时成立。

schema: zkge.score-card/v1
project_id: PROJECT.RTC

# ── L 级分层策略（按 RTC 实际工具链落地，不是通用模板）──────────────────────
# L0 模块级：纯 JS 模块 / 纯函数，node 直接跑，无浏览器无 Electron——每次提交
# L1 领域行为：VAD / 时间分组 / 应用名单 / 模型恢复，仍为 node 级——每次提交
# L2 集成：白板编辑器（vite build + node 测试脚本）、CLI rtc、REST——每合并
# L3 系统（真实运行环境）：Tauri 桌面端 + 真实 8931/8932/8933 服务 + 真实音频设备——每里程碑
layering:
  L0:
    scope: "纯模块（node --test 风格，.test.mjs）"
    tools: "node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON tests/*.test.mjs"
    frequency: "每次提交（已挂在 npm test）"
    targets:
      - "VAD 阈值与自动噪声校准（tests/vad.test.mjs）"
      - "聊天时间分组规则（tests/time-grouping.test.mjs）"
      - "静态可加载性（scripts/check-static.mjs）"
      - "未定义标识符（scripts/check-undefined.mjs，抓 ReferenceError 类整页失效）"
  L1:
    scope: "领域行为（状态判据、恢复路径、名单匹配）"
    tools: "node tests/main-status.test.mjs / model-recovery.test.mjs / audio-recovery.test.mjs / app-rule-lists.test.mjs"
    frequency: "每次提交（已挂在 npm test）"
    targets:
      - "主界面状态判据（就绪 / 降级 / 不可用）"
      - "本地模型缺失或加载失败时的恢复路径"
      - "睡眠唤醒后的音频恢复判定"
      - "自动粘贴/自动发送的应用名单匹配（含空名单=全局老行为）"
  L2:
    scope: "白板编辑器 + 外部通道（需先 vite build）"
    tools: "cd meeting-board && npx vite build && node --test meeting-board/tests/*.test.mjs"
    frequency: "每合并"
    targets:
      - "外部 AI 写入与正文/分析的分离（ai-content-write.test.mjs）"
      - "外部刷新指纹三分支（external-refresh.test.mjs）"
      - "逐字稿面板与场次搜索（transcript / session-search / preliminary-panel）"
      - "编辑器滚动与 IME 守卫（editor-scroll.test.mjs）"
  L3:
    scope: "系统级真实运行（Tauri/WKWebView + 真实本机服务 + 真实麦克风）"
    tools: "npm run dev（桌面端人工实测）｜npm run check:audio（音频链路，需 Playwright）｜npm run check:ux（需先 vite build）"
    frequency: "每里程碑 / 发布前"
    targets:
      - "录音中拔麦、系统静音、设备切换的真实表现"
      - "睡眠唤醒后音频上下文 interrupted 的真实恢复"
      - "磁盘满 / 目录不可写时的落盘失败表现"
      - "更新安装期间正在录音的处理"
      - "图谱 roundtrip（阶段⑨）"

# ── Score Card 用例（每行 9 列）──────────────────────────────────────────────
# id | scenario | stage | system | component | code_loc | deps | risk | impact_if_fails
cases:
  - id: L0-01
    scenario: "VAD 静音判定与自动噪声校准：静音不得被当成有效语音，且不吞掉低音量真语音"
    stage: "采集·判定"
    system: "RTC 前端"
    component: "src/js/vad.js"
    code_loc: "src/js/vad.js"
    deps: "无"
    risk: "中：误判=丢内容或录空气"
    impact_if_fails: "CLAIM.AUDIO.001 / CLAIM.AUDIO.003；能力问题 S-009/S-015"
  - id: L0-02
    scenario: "录制按钮与界面元素在静态层面可被加载（历史事故：CSS 游离声明块吞掉下一条规则，按钮退化成灰方块）"
    stage: "主界面"
    system: "RTC 前端"
    component: "scripts/check-static.mjs"
    code_loc: "scripts/check-static.mjs"
    deps: "无"
    risk: "中：整块 UI 静默失效"
    impact_if_fails: "能力问题 S-002 类；UI 基本可用性"
  - id: L0-03
    scenario: "模块顶层常量被删导致整页停在 hidden（ReferenceError）"
    stage: "全站"
    system: "RTC 前端"
    component: "scripts/check-undefined.mjs"
    code_loc: "scripts/check-undefined.mjs"
    deps: "tsc --checkJs"
    risk: "高：入口点了没反应"
    impact_if_fails: "全部前端 claim 的前置条件"
  - id: L1-01
    scenario: "主界面状态判据：端口可达但模型未加载时不得显示「就绪」"
    stage: "状态区"
    system: "RTC 前端 + 本机服务"
    component: "src/js/state.js / asr.js"
    code_loc: "tests/main-status.test.mjs"
    deps: "无（模拟服务探测结果）"
    risk: "高：状态说谎"
    impact_if_fails: "CLAIM.ASR.001；能力问题 C-005 / S-042"
  - id: L1-02
    scenario: "本机模型缺失或加载失败时的恢复路径"
    stage: "识别"
    system: "RTC + asr_local"
    component: "src/js/asr.js"
    code_loc: "tests/model-recovery.test.mjs"
    deps: "无"
    risk: "高：录音中静默丢话"
    impact_if_fails: "CLAIM.ASR.002；能力问题 S-042"
  - id: L1-03
    scenario: "睡眠唤醒后音频/识别链路不可用时的判定与恢复动作"
    stage: "生命周期"
    system: "RTC（WKWebView）"
    component: "src/js/audio.js / lifecycle.js"
    code_loc: "tests/audio-recovery.test.mjs"
    deps: "无（模拟上下文状态）"
    risk: "高：界面照旧却不转写"
    impact_if_fails: "CLAIM.LIFECYCLE.001 / 002；能力问题 S-189 / S-190"
  - id: L1-04
    scenario: "自动粘贴/自动发送的应用名单匹配（含名单外静默、空名单=全局老行为）"
    stage: "投递"
    system: "RTC 前端"
    component: "src/js/pastebadge.js / clipboard.js"
    code_loc: "tests/app-rule-lists.test.mjs"
    deps: "无"
    risk: "中：发到错误应用"
    impact_if_fails: "CLAIM.PASTE.001；能力问题 S-105 / S-125"
  - id: L2-01
    scenario: "外部 AI 整篇替换正文时不得静默抹掉用户手写段落"
    stage: "白板·写入"
    system: "meeting-board"
    component: "src/lib/*（write-document 通道）"
    code_loc: "meeting-board/tests/ai-content-write.test.mjs"
    deps: "先 npx vite build"
    risk: "高：用户内容不可恢复"
    impact_if_fails: "CLAIM.BOARD.001；能力问题 S-209 / C-020"
  - id: L2-02
    scenario: "外部写入后白板界面的自动重读（指纹三分支）"
    stage: "白板·刷新"
    system: "meeting-board"
    component: "externalRefresh"
    code_loc: "meeting-board/tests/external-refresh.test.mjs"
    deps: "先 npx vite build"
    risk: "中：内容变了界面不显示"
    impact_if_fails: "CLAIM.BOARD.003 / BOARD.006；能力问题 C-024"
  - id: L2-03
    scenario: "场次搜索与逐字稿面板在记录被清除后的表现（死入口）"
