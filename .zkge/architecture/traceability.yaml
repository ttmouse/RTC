# ============================================================
# 追踪关系：声明 → 实现 → 测试 → 运行
# 项目：RTC 实时语音转文字
#
# 【本文件由两次侦察合并生成，非自由撰写】
#   来源 A：architecture/score-card.yaml 的 cq_test_mapping（38 条 claim → 用例 id）
#   来源 B：architecture/verification-plan.yaml 的 plan（38 条 claim → 验证手段，点名了测试文件）
#   用例 id → 真实测试文件的对应由人手工确认（CASE_TEST 表），逐条核对了文件是否存在。
#
# 【生成时发现的两处源数据瑕疵，已如实记在对应条目里】
#   1. score-card 的 code_loc 字段在不同用例里含义不一致：L0-* 放的是实现文件，
#      L1-*/L2-* 放的是测试文件。本文件一律改用 component 字段作 implementation_ref。
#   2. tests/time-grouping.test.mjs、meeting-board/tests/{transcript,preliminary,
#      preliminary-panel,markdown-block-patch}.test.mjs、scripts/check-ux.mjs
#      这 6 个检查真实存在且当前全绿，但 score-card 的能力问题映射里从未引用它们
#      —— 属于「测了但没进能力问题账本」，见文末 orphan_checks。
#
# status: traced = 实现与测试两跳都落到了真实存在的文件；gap = 至少一跳缺失。
# evidence_ref 一律为空：38 条 claim 的 status 全是 NOT_STARTED，还没有任何一次运行产出证据。
# ============================================================
