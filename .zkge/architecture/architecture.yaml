# ============================================================
# 阶段③ 架构承诺：模块边界 DAG
# 项目：RTC 实时语音转文字 ｜ 人工填写，依据实际目录与 intent.yaml 的 code_mapping
#
# 【这份文件是承诺，不是描述】阶段⑦ 会拿它和真实代码图比对：声明了却查不到的边、
# 代码里存在却未声明的边，都算偏差。所以每条依赖都要能写出「工作真的流过吗」。
# 本文件收敛了 RTC 的十个职责单元；不是目录树，是职责边界。
# ============================================================
schema: zkge.architecture/v1
project_id: PROJECT.RTC

architecture:
  modules:
    - name: ui.render
      responsibility: "主界面与历史渲染：状态展示、时间分组、去向徽标、统计面板。只消费状态，不产生识别结果。"
      human_gate: false
    - name: capture.audio
      responsibility: "麦克风采集与音频看护：取流、VAD 静音判定、自动噪声校准、音频流动看护、电平表。"
      human_gate: false
    - name: asr.client
      responsibility: "识别客户端：把音频流交给引擎，取回文本；引擎可用性判据与切换。"
      human_gate: false
    - name: svc.local
      responsibility: "本机服务：8931 REST/代理、8932 识别 WS、8933 模型管理；模型装载与卸载。"
      human_gate: false
    - name: store.events
      responsibility: "记录落盘与读取：按本机日期分文件的 JSONL 追加、历史读取、历史清除。"
      human_gate: false
    - name: config.store
      responsibility: "配置状态：设置项、语音指令三张表、粘贴/发送名单、密钥字段。界面、CLI、外部 AI 三方共写同一份文件。"
      human_gate: false
    - name: deliver.toApp
      responsibility: "把一条记录投递到目标应用：前台应用身份识别、名单匹配、粘贴与回车。名单外静默失败。"
      human_gate: false
    - name: shell.desktop
      responsibility: "桌面外壳：窗口与权限、音乐/系统事件桥、在访达中显示、更新安装与重启。"
      human_gate: true
    - name: board.editor
      responsibility: "会议白板编辑器：正文/分析双标签、编辑与只读模式、逐字稿面板、场次搜索、外部刷新重读。"
      human_gate: false
    - name: board.external
      responsibility: "白板的外部 AI 通道：CLI rtc board 与 REST 写入；是产品鼓励的用法，不是攻击面。"
      human_gate: false
    - name: tooling.check
      responsibility: "检查与测试：静态可加载性、未定义标识符、无头 UX、音频链路、各层单测。只读，不参与运行时。"
      human_gate: false

  dependencies:
    # ── 采集 → 识别 → 落盘 → 显示（主干）──────────────────────────────
    - from: ui.render
      to: capture.audio
      reason: "点麦克风/空格启动录制，采集随之开始"
      human_gate: false
    - from: capture.audio
      to: asr.client
      reason: "有效音频分片交给识别客户端"
      human_gate: false
    - from: asr.client
      to: svc.local
      reason: "本机模式经 8932 识别 WS 取结果"
      human_gate: false
    - from: svc.local
      to: asr.client
      reason: "识别结果回传（或服务不可达信号）"
      human_gate: false
    - from: asr.client
      to: store.events
      reason: "识别成功的一条写入当日 JSONL（SegmentPersisted）"
      human_gate: false
    - from: store.events
      to: ui.render
      reason: "「显示即可得」：只有落盘成功的记录才进入列表"
      human_gate: false

    # ── 投递（粘贴/发送）──────────────────────────────────────────────
    - from: ui.render
      to: deliver.toApp
      reason: "识别完成后触发自动粘贴/自动发送"
      human_gate: false
    - from: deliver.toApp
      to: shell.desktop
      reason: "取当前前台应用身份（须走系统身份，不是手工名称）"
      human_gate: false
    - from: deliver.toApp
      to: config.store
      reason: "读取粘贴/发送名单与总闸开关"
      human_gate: false
    - from: store.events
      to: deliver.toApp
      reason: "以记录为单位携带去向（targetApp），写入去向徽标"
      human_gate: false

    # ── 配置三方共写（已知冲突面）─────────────────────────────────────
    - from: ui.render
      to: config.store
      reason: "设置页/指令管理页保存"
      human_gate: false
    - from: board.external
      to: config.store
      reason: "外部 AI 经 rtc config set 写入（整份读改写，与界面不同队）"
      human_gate: false

    # ── 白板（正文与外部通道）─────────────────────────────────────────
    - from: board.external
      to: board.editor
      reason: "外部写入文档文件后，界面按指纹变化重读"
      human_gate: false
    - from: board.editor
      to: store.events
      reason: "逐字稿面板与场次搜索读记录文件反推场次（删除记录即断掉正文入口）"
      human_gate: false
    - from: ui.render
      to: board.editor
      reason: "从主界面打开某一会议的正文"
      human_gate: false

    # ── 桌面外壳（能力注入与不可逆动作）───────────────────────────────
    - from: shell.desktop
      to: ui.render
      reason: "注入系统能力：权限状态、前台应用、音乐事件、更新状态"
      human_gate: false
    - from: shell.desktop
      to: config.store
      reason: "更新安装后重启实例，读回配置"
      human_gate: true

    # ── 检查层（只读）─────────────────────────────────────────────────
    - from: tooling.check
      to: ui.render
      reason: "静态可加载性与未定义标识符检查（不通过则整个前端不可用）"
      human_gate: false
    - from: tooling.check
      to: board.editor
      reason: "白板单测需先 vite build"
      human_gate: false
    - from: tooling.check
      to: capture.audio
      reason: "音频链路检查（需 Playwright，headless 复现不出桌面端渲染路径）"
      human_gate: false

  # 任务图规则④：人类闸门位置（不可逆边必须人审）
  human_gates:
    - action: "清除历史记录（不可逆删除转写内容）"
      position: "ui.render → store.events 的清除入口，二次确认后执行"
      approver: "用户本人（单人产品，无第二方）"
      evidence_required: "HistoryCleared 事件含 scope 与 sessions_affected；清除后界面读到的记录集合为空且无死入口"
    - action: "安装更新并重启应用（可能打断正在进行的录音）"
      position: "shell.desktop 的更新安装边"
      approver: "用户本人"
      evidence_required: "recording_active=true 时该次安装被阻止 ∨ 内容已落盘并告知用户"
    - action: "恢复默认配置（覆盖用户现有 config.json）"
      position: "config.store 的恢复默认入口"
      approver: "用户本人"
      evidence_required: "DefaultsRestored 事件含 scope 与备份引用；未知键透传不被抹掉"
    - action: "白板外部写入与用户手写内容冲突的裁决"
      position: "board.editor 保存前检测（BoardConflictDetected）"
      approver: "用户本人"
      evidence_required: "存在用户裁决记录；任一方不得单方决定（当前无实现，见 CLAIM.BOARD.002）"