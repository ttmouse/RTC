# 来源能力问题：S-140, C-014, C-015
schema: zkge.claim/v1
id: CLAIM.CONFIG.001
business_id: S-140
business_entry: '设置页保存 + 外部改配置'
business_question: '用户在界面上改设置、外部 AI 助手同时在改同一个配置，谁会被覆盖？'
statement: '界面写入与外部写入同一份配置时不得互相覆盖'
owner: product.rtc
risk_level: R3
required_assurance_level: A3
scope:
  included:
    - '界面与外部工具（CLI / 外部 AI 助手）并发写'
  excluded:
    - '同一字段被双方同时修改（此时需有确定的仲裁规则）'
assumptions:
  - id: ASSUMPTION.CONFIG.001
    text: '现有合并逻辑只护住了界面内部，未覆盖命令行与外部助手'
oracle:
  type: invariant
  expression: '并发写入后，两侧各自写入的、互不冲突的字段均保留'
counterexample:
  expression: '任一侧的改动在并发后被另一侧回滚'
required_verifiers:
    - 'unit_test'
    - 'runtime_manual'
invalidation_inputs:
  - specification_digest
  - source_digest
  - artifact_digest
  - verifier_digest
status: UNKNOWN
