# 来源能力问题：C-017
schema: zkge.claim/v1
id: CLAIM.CMD.002
business_id: C-017
business_entry: '语音指令页'
business_question: '外部 AI 删掉的一条口令，用户随后编辑并保存了同一块（他并不知道它被删了）：那条被悄悄「复活」。'
statement: '被外部删除的条目不得被页面内的陈旧快照「复活」'
owner: product.rtc
risk_level: R3
required_assurance_level: A2
scope:
  included:
    - '指令管理页打开中'
    - '外部删除若干条目'
  excluded:
    - '外部删除发生在用户点击保存之后'
assumptions:
  - id: ASSUMPTION.CMD.002
    text: '删除语义必须在与外部并发的条件下也成立'
oracle:
  type: invariant
  expression: '保存后不存在「页面快照中存在、磁盘中已被外部删除」的条目'
counterexample:
  expression: '用户编辑并保存后，一条已被外部删除的指令重新出现在文件中'
required_verifiers:
    - 'unit_test'
    - 'runtime_manual'
invalidation_inputs:
  - specification_digest
  - source_digest
  - artifact_digest
  - verifier_digest
status: UNKNOWN
