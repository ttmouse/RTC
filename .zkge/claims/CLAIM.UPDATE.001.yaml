    - '录音进行中'
    - '用户点击更新横幅'
  excluded:
    - '更新在空闲状态触发'
assumptions:
  - id: ASSUMPTION.UPDATE.001
    text: '「更新提示不能弹窗打断录音」与「安装本身会重启」是两件事'
oracle:
  type: runtime
  expression: '录音中触发安装时，要么阻止安装，要么先落盘并明确告知中断'
