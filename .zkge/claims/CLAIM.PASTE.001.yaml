    - '自动发送开关开启'
  excluded:
    - '用户主动关闭自动发送'
assumptions:
  - id: ASSUMPTION.PASTE.001
    text: '发送是不可逆的对外动作，与粘贴的性质不同'
oracle:
  type: runtime
  expression: 'auto_send 开启时，用户存在可阻止或可核对即将发出的内容的途径'
counterexample:
  expression: '说错的话被自动回车发出，用户无任何干预机会且无法撤回'
required_verifiers:
    - 'runtime_manual'
invalidation_inputs:
  - specification_digest
  - source_digest
  - artifact_digest
  - verifier_digest
status: UNKNOWN
