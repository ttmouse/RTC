business_entry: '主界面底部自动发送开关'
business_question: '用户打开自动发送后，粘完是不是直接按了回车把消息发出去了？这条消息还能撤回吗？'
statement: '自动发送发出的内容不得在没有确认机会的情况下不可撤回'
owner: product.rtc
risk_level: R3
required_assurance_level: A2
scope:
