schema: zkge.project/v1
project_id: PROJECT.RTC

meta:
  name: "RTC 实时语音转文字"
  description: "把用户说的话变成字、存在本机、按用户的意思操作（粘贴/回车/打开应用）。判断和总结交给用户自己配的 AI。"
  type: existing
  committed_at: "2026-09-19T06:05:02Z"
  owner: "douba"

# A1 规范词实例：本项目的 MUST / MUST_NOT 具体指什么。
# 全部取自 docs/product-rules/ —— 这些不是本次新增的约束，是把既有产品纪律显式化。
normative_terms:
  must:
    - "空闲状态且服务连不上时，状态区不得显示「就绪」——这几个字是用户判断「能不能放心开录」的唯一依据"
    - "界面上的每个状态只能有一个真实来源：同一结论不得由两个页面各自探测、各说各话"
    - "异常状态必须同时给出「为什么」（如实翻译，认不出来就说不知道，不许编）和「怎么办」（一个真能用的动作），且提示里承诺的入口必须真的存在"
    - "录音提示音必须在麦克风启动之前响，否则提示音会被录进去变成一条识别结果"
    - "设置页「保存」必须真正写进文件，「取消」必须不写"
    - "应用级配置的目标应用必须从系统应用列表选择，保存系统识别的 .app 包名"
    - "界面颜色必须取自共享调色板变量，不得在组件里写死颜色字面量"
    - "改了 server.js 或 asr_local/server.py 后必须重新执行 npm run build:sidecar，否则打进 App 的仍是旧后端"
    - "新增顶栏入口时必须先把它加进共用样式规则（无边框 / 无底色 / 15px 线条 / 悬停印章红）"

  must_not:
    - "智能功能不得挡在「录音→出字→保存」主流程上——AI 慢、AI 挂了、没配 AI 都不能让文字丢失或延迟出现"
    - "不得显示与事实相反的状态——宁可报错，不可显示一个看起来正常的假状态"
    - "不得用应用的中文显示名做匹配依据（如「微信」），必须用稳定身份（如 WeChat）"
    - "不得把「代码里有」当成「用户需要」——找不到界面入口的能力不得直接进能力问题清单，标为「待审查」"
    - "不得用「读全量 → 改一项 → 写全量」的方式写配置"
    - "不得重跑到绿来掩盖反例或时好时坏的测试"
    - "名单外的应用不粘贴时不弹提示（用户明确选择的行为：字只留在记录里）"

  should:
    - "R2/R3 的能力问题，BUILDER 与 CHALLENGER 应使用不同上下文（理想情况不同模型）"
    - "改界面之前先读 docs/product-rules/，它记录了哪些设计是刻意为之、不能顺手改"
    - "修掉一个问题要把「以前是什么症状」写在旁边，而不是只留结论"
    - "一件改动一个分支一个提交"
    - "界面类的毛病要能量出来，不靠眼看；新增检查项必须先证明它会变红"

  may:
    - "CLI（rtc）与 REST API 作为外部 AI 的额外访问方式"
    - "统计页的展示维度增减"

# 目标：为什么做（业务层语言，零技术词）
goals:
  - "用户对着电脑说话，文字必须即时出现在屏幕上并存进本机——即使断网、即使没配任何 AI"
  - "用户能一眼判断「现在到底能不能录」；说出了问题就必须给出去路，不把人丢在死路上"
  - "用户自己配的指令、名单、设置不会被自己或别的工具悄悄改回去"
  - "转写记录和配置是普通文本文件，用户能带走，外部 AI 助手也能读"

# 反目标：明确不做（防范围漂移）
non_goals:
  - "不做判断和总结——「哪句重要」「该怎么总结」「这算不算一条指令」交给用户自己配的 AI"
  - "不做云端账户体系、不做登录、不做数据上报"
  - "不做内置 AI 绑定——用户换服务商不该来找我们改代码（唯一例外：一键生成会议纪要，为保零配置可用）"
  - "手机端（iOS）暂不在本次初始化范围内"

# 边界：数据 / 信任 / 外部依赖
boundaries:
  external_systems:
    - name: "阿里云百炼 ASR"
      direction: out
      data: "音频流 + API Key（仅用户选择该引擎时）"
    - name: "用户自配的 LLM 服务商（OpenAI 兼容）"
      direction: out
      data: "待处理文本 + API Key；RTC 只做透明代理，不指定厂商"
    - name: "macOS 系统应用列表 / 前台应用（NSWorkspace）"
      direction: in
      data: "应用包名（稳定身份）与前台应用显示名"
    - name: "本机模型服务（8933 HTTP）与识别通道（8932 WS）"
      direction: both
      data: "音频流进、识别结果出；由 asr_local/server.py 提供"
    - name: "外部 AI Agent（经 CLI `rtc` 与 REST API）"
      direction: both
      data: "读转写记录 / 读会议白板；写白板正文与分析结果"

  irreversible_operations:
    - "设置页「清除历史」——删除转写记录，不可恢复"
    - "设置页「清除所有数据」——删除记录 + 配置，不可恢复"
    - "白板 write-document 不带 --append 时整篇替换正文"
    - "覆盖写入当天记录文件 events/YYYY-MM-DD.jsonl"

  reliability_requirements:
    - "录音期间任何一环坏掉，界面必须如实报出，不得静默丢字"
    - "系统睡眠唤醒后音频与识别链路必须自愈；救不回来必须报「没有声音输入」"
    - "空闲态不得显示「就绪」当服务不可达"

# 开放问题：没有答案就写「未知」，不允许自动补成听起来合理的答案
open_questions:
  - "ux-issue-log 的 UX-2/3/4/5/6/7/8/9 均为「待定」状态：现象已证实，但要不要改、改成什么样需要产品判断，目前无 owner"
  - "手机端（iOS）是否纳入本验证体系，尚未决定"
  - "会议白板是否接入共享调色板、黄色强调色去留（UX-4），尚未决定"
  - "白板次要文字对比度是否算「刻意的淡」（UX-3），尚未决定——承认刻意的就必须把 4.5:1 从规范里去掉，不能两边都要"