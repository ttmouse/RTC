[package]
name = "rtc-transcriber"
version = "1.0.20"
description = "实时语音转文字"
authors = ["rtc-transcriber contributors"]
edition = "2021"

[lib]
name = "rtc_transcriber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3.6.1", default-features = false }
core-foundation = "0.10"
# 查「当前最前台的应用」（粘贴目标）。这三个 crate 本来就在依赖树里（tauri 的传递
# 依赖），这里只是提成直接依赖并显式打开需要的 feature，不引入新的第三方代码。
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace", "NSRunningApplication", "libc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString"] }
